function showToast(message,opts={}){const t=document.querySelector('#toast');if(!t)return;clearTimeout(toastTimer);t.className='toast'+(opts.warn?' warn':'');t.innerHTML=`<span>${esc(message)}</span>${opts.action?`<button type="button">${esc(opts.action)}</button>`:''}`;if(opts.action)t.querySelector('button').onclick=()=>{t.hidden=true;opts.onAction()};t.hidden=false;toastTimer=setTimeout(()=>{t.hidden=true},opts.action?8000:4500)}
async function postJson(path,payload){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let result={};try{result=await response.json()}catch(e){}if(!response.ok)throw new Error(result.error||`サーバーエラー（${response.status}）`);return result}
const archiveZoneHtml=x=>`<section class="detail-section archive-zone" id="archive-zone"><h3>博士に送った個体</h3><p class="meta">ゲームで博士に送ったら押してください。一覧・編成・整理判定から外れます。データは残り、整理タブの「送った個体」から戻せます。</p><div id="archive-actions"><button type="button" class="btn-danger" data-needs-api ${API_READY?'':'disabled'} onclick="startArchive('${esc(x.uid)}')">博士に送った（ボックスから外す）</button></div>${API_NOTE}<p id="archive-status" class="meta" aria-live="polite"></p></section>`;
function startArchive(uid){const x=DATA.find(v=>v.uid===uid),box=document.querySelector('#archive-actions');if(!x||!box||!API_READY)return;box.innerHTML=`<div class="confirm-panel" role="group" aria-labelledby="archive-confirm-title"><strong id="archive-confirm-title">ボックスから外しますか？</strong><p>${esc(x.base_name||x.species_ja||x.species)}（Lv${esc(x.level??'-')}・SP ${esc(fmt(x.sp))}・個体ID ${esc(shortId(uid))}）を博士に送った個体として外します。</p><div class="confirm-actions"><button type="button" class="btn-quiet" id="archive-cancel" onclick="cancelArchive('${esc(uid)}')">やめる</button><button type="button" class="btn-danger solid" id="archive-confirm" onclick="archivePokemon('${esc(uid)}')">外す</button></div></div>`;document.querySelector('#archive-cancel').focus()}
function cancelArchive(uid){const zone=document.querySelector('#archive-zone'),x=DATA.find(v=>v.uid===uid);if(zone&&x)zone.outerHTML=archiveZoneHtml(x)}
const currentTab=()=>document.querySelector('#box-tab.active')?'box':document.querySelector('#custom-tab.active')?'custom':document.querySelector('.tabs [data-tab].active')?.dataset.tab||'box';
const openTab=tab=>{if(tab==='box')showBox();else if(tab==='custom')showCustomTeam();else if(document.querySelector(`.tabs [data-tab="${tab}"]`))draw(tab)};
// The server has already re-rendered the page, so reload it and show the result there.
function reloadWithToast(toast){try{sessionStorage.setItem('sbc-toast',JSON.stringify({...toast,tab:currentTab()}))}catch(e){}location.replace(`${location.pathname}?v=${Date.now()}`)}
async function archivePokemon(uid){const x=DATA.find(v=>v.uid===uid),status=document.querySelector('#archive-status');document.querySelectorAll('#archive-actions button').forEach(b=>{b.disabled=true;b.dataset.busy='1'});if(status)status.textContent='保存中…';try{const result=await postJson('/api/archive',{uids:[uid]});const name=x?(x.base_name||x.species_ja||x.species):'個体';if(result.rendered===false){if(status)status.textContent=result.warning||'保存しましたが、ページの更新に失敗しました。';return}reloadWithToast({message:`${name}をボックスから外しました`,undo:uid})}catch(e){if(status)status.textContent=e.message;document.querySelectorAll('#archive-actions button').forEach(b=>{delete b.dataset.busy;b.disabled=false})}}
async function restorePokemon(uid,button){if(button){button.disabled=true;button.dataset.busy='1'}try{await postJson('/api/unarchive',{uids:[uid]});const x=ARCHIVED.find(v=>v.uid===uid);reloadWithToast({message:`${x?archivedName(x):'個体'}をボックスに戻しました`})}catch(e){showToast(e.message,{warn:true});if(button){delete button.dataset.busy;button.disabled=false}}}
const archivedSectionHtml=()=>`<article class="card" id="archived-list"><div class="eyebrow">Sent to the Professor</div><h2>送った個体 <small>${ARCHIVED.length}匹</small></h2><p class="meta">博士に送ってボックスから外した個体です。間違えて外したときは「戻す」を押すと、ボックスと判定に戻ります。</p>${ARCHIVED.length?'<div class="archived-rows">'+ARCHIVED.map(x=>`<div class="archived-row"><div><strong>${esc(archivedName(x))}</strong>${x.display_name?` <small>${esc(x.species_ja||x.species)}</small>`:''}<span class="meta">Lv${esc(x.level??'-')} · SP ${esc(fmt(x.sp))} · ${esc(fmtArchivedAt(x.archived_at))} · 個体ID ${esc(shortId(x.uid))}</span></div><button type="button" class="btn-quiet" data-needs-api ${API_READY?'':'disabled'} onclick="restorePokemon('${esc(x.uid)}',this)">戻す</button></div>`).join('')+'</div>':'<p class="meta">まだありません。ポケモンの詳細画面の「博士に送った（ボックスから外す）」で外せます。</p>'}${API_NOTE}</article>`;
const setupArchivedList=()=>{if(!document.querySelector('.tabs [data-tab="send"].active')||document.querySelector('#archived-list'))return;document.querySelector('#list').insertAdjacentHTML('beforeend',archivedSectionHtml())};
const archiveOpenPokemonDetail=openPokemonDetail;openPokemonDetail=function(uid){archiveOpenPokemonDetail(uid);const x=DATA.find(v=>v.uid===uid),body=document.querySelector('#pokemon-dialog .detail-body');if(x&&body)body.insertAdjacentHTML('beforeend',archiveZoneHtml(x))};
(()=>{let toast=null;try{toast=JSON.parse(sessionStorage.getItem('sbc-toast')||'null');sessionStorage.removeItem('sbc-toast')}catch(e){}if(!toast||!toast.message)return;setTimeout(()=>{if(toast.tab)openTab(toast.tab);showToast(toast.message,toast.undo?{action:'元に戻す',onAction:()=>API_CHECK.then(()=>restorePokemon(toast.undo))}:{})},0)})();

const refreshViews=()=>{clarifyCooking();linkIndividuals();decorateDecisions();setupSeedPriority();setupCustomTeam();setupTeamGoal();setupBoxTools();setupArchivedList()};
const clarifyCooking=()=>document.querySelectorAll('#list .guide-note span,#list .guide-intro .meta').forEach(x=>{const next=x.textContent.replace('料理は除外しています。','食材・料理スキルをレシピLv1で計算しています。').replace('料理を除き、きのみと直接エナジースキルだけを集計。','きのみ・料理・全メインスキルを集計。料理は3カテゴリ平均・レシピLv1です。');if(next!==x.textContent)x.textContent=next});new MutationObserver(refreshViews).observe(document.querySelector('#list'),{childList:true,subtree:true});
document.addEventListener('click',e=>{const el=e.target.closest('[data-pokemon-uid]');if(el&&!e.target.closest('button,select,input')&&!document.querySelector('#pokemon-dialog')?.open)openPokemonDetail(el.dataset.pokemonUid)});document.addEventListener('keydown',e=>{const el=e.target.closest('[data-pokemon-uid]');if(el&&['Enter',' '].includes(e.key)){e.preventDefault();openPokemonDetail(el.dataset.pokemonUid)}});
function tierPage(){const order=['SS','S','A','B','C','D'];const rows=[...TIERS].sort((a,b)=>(order.indexOf(a.external_tier)-order.indexOf(b.external_tier))||a.species_ja.localeCompare(b.species_ja,'ja'));const chip=tier=>`<span class="tier-chip ext t-${tier}">外部 ${tier}</span>`;return `<section class="guide-intro"><div class="eyebrow">External ratings</div><h2>外部での評価</h2><p class="meta">攻略サイトが示す役割ごとの強みと種族Tierです。手持ち個体の点数や整理判定には加えません。</p></section><div class="insight-grid"><article class="card"><div class="eyebrow">Berry</div><h2>きのみで優れる点</h2><p><strong>好物一致と速いおてつだい</strong></p><p class="meta">1回にきのみを2個拾います。各フィールドの好物に合い、おてつだい効率が高い種族が高評価です。</p><p><a href="https://game8.jp/pokemonsleep/576992" target="_blank" rel="noreferrer">きのみ最強ランキング</a></p></article><article class="card"><div class="eyebrow">Ingredient</div><h2>食材で優れる点</h2><p><strong>カメックス・フシギバナ・カイリュー</strong></p><p class="meta">必要な食材を多く集め、料理を安定させる点が評価されています。食材確率と所持数も重要です。</p><p><a href="https://game8.jp/pokemonsleep/577877" target="_blank" rel="noreferrer">食材最強ランキング</a></p></article><article class="card"><div class="eyebrow">Skill</div><h2>スキルで優れる点</h2><p><strong>サーナイト・ライコウ・エンテイ</strong></p><p class="meta">全体回復や即時おてつだい支援が強みです。スキル得意は発動を2回分までストックできます。</p><p><a href="https://game8.jp/pokemonsleep/597662" target="_blank" rel="noreferrer">スキル最強ランキング</a></p></article><article class="card"><div class="eyebrow">Game8</div><h2>総合評価</h2><p><strong>掲載上位：サーナイト</strong></p><p class="meta">回復・食材・種族性能をまとめた総合ランキングです。</p><p><a href="https://game8.jp/pokemonsleep/542600" target="_blank" rel="noreferrer">総合Tier表</a></p></article></div>${rows.length?`<article class="card"><div class="eyebrow">Gamerch snapshot</div><h2>終盤最強Tier（${rows.length}種）</h2><div class="tier-legend">${order.map(chip).join('')}</div>${rows.map(r=>`<div class="tier-row"><div class="tier-row-name"><strong>${esc(r.species_ja)}</strong></div><div class="tier-badges">${chip(r.external_tier)}</div></div>`).join('')}</article>`:'<article class="card empty">外部Tierデータを更新すると一覧が表示されます。</article>'}<div class="guide-note"><div>↗</div><div><strong>外部評価は参考情報</strong><span>各サイトで前提や更新時期が異なります。このアプリ独自の評価方法は「使い方」にまとめています。</span></div></div>`}
function draw(tab){document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});if(tab==='energy'){document.querySelector('#list').innerHTML=energyPage();document.querySelectorAll('[data-energy-mode]').forEach(b=>b.onclick=()=>{energyMode=b.dataset.energyMode;draw('energy')});return}if(tab==='capture'){document.querySelector('#list').innerHTML=capturePage();return}if(tab==='analysis'){document.querySelector('#list').innerHTML=analysisPage();return}if(tab==='tiers'){document.querySelector('#list').innerHTML=tierPage();document.querySelectorAll('[data-tier-sort]').forEach(b=>b.onclick=()=>{tierSort=b.dataset.tierSort;draw('tiers')});return}if(tab==='teams'){document.querySelector('#list').innerHTML=teamControls();const bs=[...document.querySelectorAll('.berry')];document.querySelector('#island').value='cyan';bs.forEach((x,i)=>x.value=ISLANDS.cyan.berries[i]);document.querySelector('#island').onchange=e=>{const preset=ISLANDS[e.target.value].berries;if(preset.length)bs.forEach((x,i)=>x.value=preset[i]);updateTeam()};bs.forEach(x=>x.onchange=()=>{document.querySelector('#island').value='custom';updateTeam()});document.querySelector('#team-mode').onchange=updateTeam;updateTeam();return}if(tab==='pokemon'){document.querySelector('#list').innerHTML=pokemonControls();document.querySelector('#poke-search').oninput=updatePokemonList;document.querySelector('#type-filter').onchange=updatePokemonList;updatePokemonList();return}if(tab==='guide'){document.querySelector('#list').innerHTML=guidePage();return}const xs=DATA.filter(x=>tab==='keep'?(TRAINING.entries.length?!!TRAINING_BY_UID[x.uid]:(x.absolute_score??0)>85):tab==='send'?['send','protected'].includes(x.verdict):(x.verdict||'protected')===tab).sort((a,b)=>(b.absolute_score||0)-(a.absolute_score||0));document.querySelector('#list').innerHTML=xs.length?xs.map(x=>{const e=x.evaluations||{};const best=l=>Math.max(...Object.values(e[l]||{0:0}));return `<article class="card ${x.verdict||tab}" data-pokemon-uid="${x.uid}"><div class="meta">BOX ${x.box_index??'-'} · Lv${x.level??'-'}</div><h2>${esc(x.display_name||x.species_ja||x.species)}${x.verified&&x.absolute_score>=85?' <span class="excellent-mark" title="総合85点以上">★</span>':''} <small>${x.verified?`${x.absolute_score??0} / 100`:`暫定 ${x.absolute_score??0} / 100`} · エナジー ${x.energy_score??'-'}</small></h2><p>${esc(x.reason)}</p><div class="scores">${['60','80'].map(l=>`<div class="score">Lv${l}${l==='80'?'予測':''}<br><strong>${Math.round(best(l))}</strong></div>`).join('')}</div><p class="meta">きのみ ${x.absolute_by_role?.berry??0}　食材 ${x.absolute_by_role?.ingredient??0}　スキル ${x.absolute_by_role?.skill??0}</p><p class="meta">育成時点別：${levelScoreText(x)}</p></article>`}).join(''):'<div class="card empty">該当する個体はいません。</div>'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>draw(b.dataset.tab));const hasForecast=(INSIGHTS.forecasts||[]).some(x=>x.modes&&Object.keys(x.modes).length);if(hasForecast)draw('energy');else showBox();</script></body></html>
