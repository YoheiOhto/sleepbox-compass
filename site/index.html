<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sleepbox Compass</title><style>
:root{color-scheme:light dark;--bg:#f7f8f4;--card:#fff;--ink:#21302a;--green:#34785a;--red:#b54141}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
main{max-width:920px;margin:auto;padding:20px}.hero{padding:28px 0}.tabs{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:10px 0}
button{border:0;border-radius:999px;padding:10px 16px;background:#dfe9e2;color:#183c2b}.active{background:var(--green);color:white}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}.meta{opacity:.7}.send{border-left:6px solid var(--red)}.keep{border-left:6px solid var(--green)}.protected{border-left:6px solid #b99420}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.score{padding:8px;background:#00000008;border-radius:8px}h1{font-size:clamp(25px,7vw,42px);margin:0}h2{margin-bottom:4px}
@media(prefers-color-scheme:dark){:root{--bg:#142019;--card:#1d2c24;--ink:#eef7f1}.score{background:#ffffff0b}}
</style></head>
<body><main><section class="hero"><h1>Sleepbox Compass</h1><p>好みのきのみ3種から、手持ちの最強5匹を選びます。</p></section><nav class="tabs"><button data-tab="keep">育成キュー</button><button data-tab="teams">最強パーティ</button><button data-tab="send">送るリスト</button><button data-tab="protected">保護</button></nav><section id="list"></section></main>
<script>const DATA=[{"uid": "169bb9f6695e350245cc", "species": "BULBASAUR", "display_name": "サンプルA", "level": 15, "box_index": 1, "verdict": "keep", "reason": "Lv50/60/70/80のいずれかの役割で同種上位候補です", "evaluations": {"50": {"berry": 110.0, "ingredient": 165.0, "skill": 85.0}, "60": {"berry": 120.0, "ingredient": 180.0, "skill": 90.0}, "70": {"berry": 126.0, "ingredient": 188.0, "skill": 91.0}, "80": {"berry": 132.0, "ingredient": 195.0, "skill": 92.0}}, "absolute_score": 73.8, "absolute_by_role": {"berry": 49.6, "ingredient": 73.8, "skill": 36.1}, "pokemon_type": "くさ", "berry": "DURIN", "production_scores": {"current": {"total": 90, "berry": 25}, "50": {"total": 125, "berry": 38}, "60": {"total": 145, "berry": 45}, "70": {"total": 155, "berry": 49}, "80": {"total": 165, "berry": 52}}}, {"uid": "26d5f124321fd73bd6ea", "species": "BULBASAUR", "display_name": "サンプルB", "level": 12, "box_index": 2, "verdict": "send", "reason": "同種の上位個体が全3ロール・Lv50/60/70/80でそれぞれ2匹以上います", "evaluations": {"50": {"berry": 75.0, "ingredient": 95.0, "skill": 58.0}, "60": {"berry": 80.0, "ingredient": 100.0, "skill": 60.0}, "70": {"berry": 81.0, "ingredient": 101.0, "skill": 60.0}, "80": {"berry": 82.0, "ingredient": 102.0, "skill": 61.0}}, "absolute_score": 40.1, "absolute_by_role": {"berry": 32.1, "ingredient": 40.1, "skill": 24.0}, "pokemon_type": "くさ", "berry": "DURIN", "production_scores": {"current": {"total": 62, "berry": 18}, "50": {"total": 85, "berry": 25}, "60": {"total": 92, "berry": 28}, "70": {"total": 96, "berry": 30}, "80": {"total": 100, "berry": 32}}}, {"uid": "f7d4f0ac685f39365f6b", "species": "BULBASAUR", "display_name": "サンプルC", "level": 10, "box_index": 3, "verdict": "keep", "reason": "Lv50/60/70/80のいずれかの役割で同種上位候補です", "evaluations": {"50": {"berry": 135.0, "ingredient": 195.0, "skill": 100.0}, "60": {"berry": 150.0, "ingredient": 210.0, "skill": 110.0}, "70": {"berry": 170.0, "ingredient": 225.0, "skill": 125.0}, "80": {"berry": 190.0, "ingredient": 240.0, "skill": 145.0}}, "absolute_score": 88.5, "absolute_by_role": {"berry": 66.3, "ingredient": 88.5, "skill": 49.5}, "pokemon_type": "くさ", "berry": "DURIN", "production_scores": {"current": {"total": 105, "berry": 30}, "50": {"total": 150, "berry": 45}, "60": {"total": 175, "berry": 54}, "70": {"total": 198, "berry": 62}, "80": {"total": 220, "berry": 70}}}];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BERRIES={PAMTRE:'シーヤ',LUM:'ラム',GREPA:'ウブ',BLUK:'ブリー',PECHA:'モモン',MAGO:'マゴ',LEPPA:'ヒメリ',CHERI:'クラボ',PERSIM:'キー',FIGY:'フィラ',DURIN:'ドリ',SITRUS:'オボン',ORAN:'オレン',WIKI:'ウイ',CHESTO:'カゴ',RAWST:'チーゴ',BELUE:'ベリブ',YACHE:'ヤチェ'};
const ISLANDS={custom:{name:'自由選択',berries:[]},greengrass:{name:'ワカクサ本島（ランダム）',berries:[]},cyan:{name:'シアンの砂浜',berries:['ORAN','PAMTRE','PECHA']},taupe:{name:'トープ洞窟',berries:['FIGY','LEPPA','SITRUS']},snowdrop:{name:'ウノハナ雪原',berries:['PERSIM','RAWST','WIKI']},lapis:{name:'ラピスラズリ湖畔',berries:['CHERI','DURIN','MAGO']},powerplant:{name:'ゴールド旧発電所',berries:['BELUE','BLUK','GREPA']},amber:{name:'アンバー渓谷',berries:['CHESTO','LUM','YACHE']}};
const options=o=>Object.entries(o).map(([v,n])=>`<option value="${v}">${esc(n.name||n)}</option>`).join('');
function teamControls(){return `<article class="card"><label>島 <select id="island">${options(ISLANDS)}</select></label><div class="scores">${[0,1,2].map(i=>`<label>きのみ${i+1} <select class="berry">${options(BERRIES)}</select></label>`).join('')}</div><label>評価時点 <select id="team-mode"><option value="current">現在</option>${[50,60,70,80].map(x=>`<option value="${x}">Lv${x}育成後</option>`).join('')}</select></label></article><section id="team-result"></section>`}
function updateTeam(){const favored=[...document.querySelectorAll('.berry')].map(x=>x.value),mode=document.querySelector('#team-mode').value;const ranked=DATA.map(x=>{const p=x.production_scores?.[mode];if(!p)return null;const score=Number(p.total)+(favored.includes(x.berry)?Number(p.berry):0);return {...x,teamScore:Math.round(score*100)/100}}).filter(Boolean).sort((a,b)=>b.teamScore-a.teamScore).slice(0,5);document.querySelector('#team-result').innerHTML=`<article class="card"><h2>${mode==='current'?'現在':`Lv${mode}育成後`}の最強5匹</h2>${ranked.length?`<ol>${ranked.map(x=>`<li><strong>${esc(x.display_name||x.species)}</strong> <span class="meta">${esc(x.pokemon_type||'タイプ未登録')} · ${BERRIES[x.berry]||x.berry||'きのみ未登録'} · ${x.teamScore}</span></li>`).join('')}</ol>`:'<p>生産スコアを取り込むと候補を表示します。</p>'}</article>`}
function draw(tab){document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='teams'){document.querySelector('#list').innerHTML=teamControls();const bs=[...document.querySelectorAll('.berry')];bs.forEach((x,i)=>x.value=Object.keys(BERRIES)[i]);document.querySelector('#island').onchange=e=>{const preset=ISLANDS[e.target.value].berries;if(preset.length)bs.forEach((x,i)=>x.value=preset[i]);updateTeam()};bs.forEach(x=>x.onchange=()=>{document.querySelector('#island').value='custom';updateTeam()});document.querySelector('#team-mode').onchange=updateTeam;updateTeam();return}const xs=DATA.filter(x=>(x.verdict||'protected')===tab).sort((a,b)=>(b.absolute_score||0)-(a.absolute_score||0));document.querySelector('#list').innerHTML=xs.length?xs.map(x=>{const e=x.evaluations||{};const best=l=>Math.max(...Object.values(e[l]||{0:0}));return `<article class="card ${tab}"><div class="meta">${x.box_index??'-'}番目 · Lv${x.level??'-'}</div><h2>${esc(x.display_name||x.species)} <small>総合 ${x.absolute_score??0} / 100</small></h2><p>${esc(x.reason)}</p><div class="scores">${['50','60','70','80'].map(l=>`<div class="score">Lv${l}<br><strong>${best(l)}</strong></div>`).join('')}</div><p class="meta">絶対評価: きのみ ${x.absolute_by_role?.berry??0} / 食材 ${x.absolute_by_role?.ingredient??0} / スキル ${x.absolute_by_role?.skill??0}</p></article>`}).join(''):'<p>該当する個体はありません。</p>'}document.querySelectorAll('button').forEach(b=>b.onclick=()=>draw(b.dataset.tab));draw('teams');</script></body></html>
