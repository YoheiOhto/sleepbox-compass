const setupTeamGoal=()=>{if(!document.querySelector('.tabs [data-tab="teams"].active')||document.querySelector('#team-goal'))return;const forecasts=INSIGHTS.forecasts||[];document.querySelector('#custom-team')?.insertAdjacentHTML('beforebegin',`<article id="team-goal" class="card"><h2>目標到達・週途中の立て直し</h2><div class="goal-box"><label class="field"><span>目標エナジー</span><input id="goal-energy" type="number" value="1000000"></label><label class="field"><span>現在のエナジー</span><input id="current-energy" type="number" value="0"></label><label class="field"><span>残り日数</span><input id="days-left" type="number" min="1" max="7" value="7"></label><label class="field"><span>島</span><select id="goal-island">${forecasts.map((x,i)=>`<option value="${i}">${esc(x.island)}</option>`).join('')}</select></label></div><p id="goal-result" class="energy-number"></p></article>`);document.querySelectorAll('#goal-energy,#current-energy,#days-left,#goal-island').forEach(x=>x.oninput=updateGoal);updateGoal()};
const originalCapturePage=capturePage;capturePage=function(){return originalCapturePage()+`<article class="card"><div class="eyebrow">External tier reference</div><h2>外部攻略Tierの見方</h2><p><strong>Game8総合最強：サーナイト</strong></p><p class="meta">2026年8月20日更新。げんきオールによる汎用回復、食材・種族性能を総合評価。最新追加ではデカヌチャンも強力な育成候補と評価されています。</p><p><a href="https://game8.jp/pokemonsleep/542600" target="_blank" rel="noreferrer">Game8の最新Tier表を開く</a></p><div class="guide-note"><div>↔️</div><div><strong>外部Tierと手持ち評価は別</strong><span>外部Tierは種族の一般評価。本アプリは個体・島・料理・現在の手持ち不足を評価します。</span></div></div></article><article class="card"><div class="eyebrow">Ideal individual</div><h2>このアプリの「理想個体」</h2><p class="meta">最終進化・指定Lvで、その得意分野に合う性格とサブスキルを持ち、メインスキルは最大Lv、食材は各枠の基礎候補を採用した比較用モデルです。</p><div class="detail-list"><div class="detail-row"><span>きのみ得意</span><strong>きのみの数S・速度・おてつだいボーナス</strong></div><div class="detail-row"><span>食材得意</span><strong>食材確率・速度・所持数</strong></div><div class="detail-row"><span>スキル得意</span><strong>スキル確率・速度・おてつだいボーナス</strong></div></div><p class="meta">個体スコア100は、全最終進化種の理想個体における役割別上位10%相当です。万能な一体という意味ではありません。</p></article>`};
analysisPage=function(){const q=INSIGHTS.quality||{};return `<section class="guide-intro"><div class="eyebrow">System status</div><h2>データ・計算状態</h2><p class="meta">取り込みと評価システムがどこまで動いているかを確認します。</p></section><article class="card"><h2>データ品質</h2><div class="quality"><div><strong>${q.total||0}</strong><span>総数</span></div><div><strong>${q.verified||0}</strong><span>検証済</span></div><div><strong>${q.unverified||0}</strong><span>要確認</span></div><div><strong>${q.low_confidence||0}</strong><span>OCR要確認</span></div></div></article><article class="card"><h2>総合点（0〜100点）の意味</h2><div class="detail-list"><div class="detail-row"><span>算出方法</span><strong>Lv60/Lv80のRP成分値を平均</strong></div><div class="detail-row"><span>比重</span><strong>Lv60 50%・Lv80 50%</strong></div><div class="detail-row"><span>基準（100点）</span><strong>全最終進化種の理想個体、役割別で上位10%水準</strong></div><div class="detail-row"><span>採用値</span><strong>きのみ・食材・スキルのうち最も高いロール</strong></div></div><p class="meta">Lv60は食材3枠が揃う主軸、Lv80は長期的な伸びしろです。整理候補は総合点の順位ではなく、両レベルの全ロールで複数の同種個体に支配された場合だけ選びます。</p></article><article class="card"><h2>計算機能</h2><div class="detail-list"><div class="detail-row"><span>個体評価</span><strong>${DATA.some(x=>x.absolute_score>0)?'稼働中':'未計算'}</strong></div><div class="detail-row"><span>全島編成</span><strong>${TEAMS.length?'稼働中':'未計算'}</strong></div><div class="detail-row"><span>料理・スキル</span><strong>${TEAMS.some(x=>x.cooking_included)?'稼働中':'未計算'}</strong></div><div class="detail-row"><span>任意5匹API</span><strong>localhostで利用可能</strong></div></div><button id="recalculate" onclick="recalculateAll()">評価と編成を再計算</button><p id="recalculate-status" class="meta">個体評価・島別編成・整理判定・画面をまとめて更新します。</p></article>`};
async function recalculateAll(){const button=document.querySelector('#recalculate'),status=document.querySelector('#recalculate-status');button.disabled=true;status.textContent='再計算中…数十秒かかることがあります。';try{const response=await fetch('/api/recalculate',{method:'POST'}),result=await response.json();if(!response.ok)throw new Error(result.error);status.textContent=`再計算完了（評価 ${result.evaluations}件）。画面を更新します…`;setTimeout(()=>location.replace(`${location.pathname}?v=${Date.now()}`),500)}catch(e){status.textContent=`${e.message} localhostの専用サーバーで開いてください。`;button.disabled=false}}
const refreshViews=()=>{clarifyCooking();linkIndividuals();decorateDecisions();setupSeedPriority();setupCustomTeam();setupTeamGoal();setupBoxTools()};
const clarifyCooking=()=>document.querySelectorAll('#list .guide-note span,#list .guide-intro .meta').forEach(x=>{const next=x.textContent.replace('料理は除外しています。','食材・料理スキルをレシピLv1で計算しています。').replace('料理を除き、きのみと直接エナジースキルだけを集計。','きのみ・料理・全メインスキルを集計。料理は3カテゴリ平均・レシピLv1です。');if(next!==x.textContent)x.textContent=next});new MutationObserver(refreshViews).observe(document.querySelector('#list'),{childList:true,subtree:true});
document.addEventListener('click',e=>{const el=e.target.closest('[data-pokemon-uid]');if(el&&!e.target.closest('button,select,input')&&!document.querySelector('#pokemon-dialog')?.open)openPokemonDetail(el.dataset.pokemonUid)});document.addEventListener('keydown',e=>{const el=e.target.closest('[data-pokemon-uid]');if(el&&['Enter',' '].includes(e.key)){e.preventDefault();openPokemonDetail(el.dataset.pokemonUid)}});
function tierPage(){const order=['SS','S','A','B','C','D'];const near=(a,b)=>Math.abs(order.indexOf(a)-order.indexOf(b))<=1;const rows=[...TIERS].sort((a,b)=>tierSort==='external'?(order.indexOf(a.external_tier)-order.indexOf(b.external_tier))||(b.our_score-a.our_score):b.our_score-a.our_score);const chip=(tier,kind)=>`<span class="tier-chip ${kind} t-${tier}">${kind==='own'?'本アプリ':'外部'} ${tier}</span>`;return `<section class="guide-intro"><div class="eyebrow">Methodology check</div><h2>指標の妥当性：外部Tierとの比較</h2><p class="meta">本アプリの種族スコア（理想個体・Lv60/Lv80平均・0〜100点）と、外部攻略サイトのTier評価を並べています。評価軸が異なるため、順位の一致は検算材料の一つです。</p><div class="tier-legend">${order.map(t=>chip(t,'own')).join('')}</div><div class="mode-pills">${[['own','本アプリ順位'],['external','外部Tier順位']].map(([v,n])=>`<button data-tier-sort="${v}" class="${v===tierSort?'active':''}">${n}</button>`).join('')}</div></section>${rows.length?`<article class="card"><h2>種族スコア比較（${rows.length}種）</h2>${rows.map(r=>`<div class="tier-row ${near(r.our_tier,r.external_tier)?'':'tier-mismatch'}"><div class="tier-row-name"><strong>${esc(r.species_ja)}</strong><span class="meta">${r.our_score}点${near(r.our_tier,r.external_tier)?'':' ・ ⚠ 評価軸の差が大きい'}</span></div><div class="tier-badges">${chip(r.our_tier,'own')}${chip(r.external_tier,'ext')}</div></div>`).join('')}</article>`:'<div class="card empty">pokesleep-box tier-compareを実行すると比較表が表示されます。</div>'}<article class="card"><div class="eyebrow">Source</div><h2>比較の前提</h2><p class="meta">外部Tierはgamerch.com掲載の「終盤最強」ランキング（2026年8月時点のスナップショット、SS〜Dの6段階）。本アプリは役割ごとの理想個体をLv60とLv80で評価します。外部Tierと目的が違うため、不一致だけで計算誤りとは判断しません。</p></article>`}
function draw(tab){document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});if(tab==='energy'){document.querySelector('#list').innerHTML=energyPage();document.querySelectorAll('[data-energy-mode]').forEach(b=>b.onclick=()=>{energyMode=b.dataset.energyMode;draw('energy')});return}if(tab==='capture'){document.querySelector('#list').innerHTML=capturePage();return}if(tab==='analysis'){document.querySelector('#list').innerHTML=analysisPage();return}if(tab==='tiers'){document.querySelector('#list').innerHTML=tierPage();document.querySelectorAll('[data-tier-sort]').forEach(b=>b.onclick=()=>{tierSort=b.dataset.tierSort;draw('tiers')});return}if(tab==='teams'){document.querySelector('#list').innerHTML=teamControls();const bs=[...document.querySelectorAll('.berry')];document.querySelector('#island').value='cyan';bs.forEach((x,i)=>x.value=ISLANDS.cyan.berries[i]);document.querySelector('#island').onchange=e=>{const preset=ISLANDS[e.target.value].berries;if(preset.length)bs.forEach((x,i)=>x.value=preset[i]);updateTeam()};bs.forEach(x=>x.onchange=()=>{document.querySelector('#island').value='custom';updateTeam()});document.querySelector('#team-mode').onchange=updateTeam;updateTeam();return}if(tab==='pokemon'){document.querySelector('#list').innerHTML=pokemonControls();document.querySelector('#poke-search').oninput=updatePokemonList;document.querySelector('#type-filter').onchange=updatePokemonList;updatePokemonList();return}if(tab==='guide'){document.querySelector('#list').innerHTML=guidePage();return}const xs=DATA.filter(x=>tab==='send'?['send','protected'].includes(x.verdict):(x.verdict||'protected')===tab).sort((a,b)=>(b.absolute_score||0)-(a.absolute_score||0));document.querySelector('#list').innerHTML=xs.length?xs.map(x=>{const e=x.evaluations||{};const best=l=>Math.max(...Object.values(e[l]||{0:0}));return `<article class="card ${x.verdict||tab}" data-pokemon-uid="${x.uid}"><div class="meta">BOX ${x.box_index??'-'} · Lv${x.level??'-'}</div><h2>${esc(x.display_name||x.species_ja||x.species)}${x.verified&&x.absolute_score>=85?' <span class="excellent-mark" title="総合85点以上">★</span>':''} <small>${x.verified?`${x.absolute_score??0} / 100`:'暫定評価'}</small></h2><p>${esc(x.reason)}</p><div class="scores">${['60','80'].map(l=>`<div class="score">Lv${l}${l==='80'?'予測':''}<br><strong>${Math.round(best(l))}</strong></div>`).join('')}</div><p class="meta">きのみ ${x.absolute_by_role?.berry??0}　食材 ${x.absolute_by_role?.ingredient??0}　スキル ${x.absolute_by_role?.skill??0}</p></article>`}).join(''):'<div class="card empty">該当する個体はいません。</div>'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>draw(b.dataset.tab));const hasForecast=(INSIGHTS.forecasts||[]).some(x=>x.modes&&Object.keys(x.modes).length);if(hasForecast)draw('energy');else showBox();</script></body></html>
