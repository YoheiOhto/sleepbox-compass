function guidePage(){return `<section class="guide-intro"><div class="eyebrow">How to use</div><h2>Sleepbox Compassの使い方</h2><p class="meta">手持ちを安全に整理し、今週育てる5匹を見つけます。</p></section><div class="guide-list"><article class="guide-step"><div><h3>手持ちデータを取り込む</h3><p>詳細画面の情報をJSONとして取り込みます。画像・動画・個人DBは公開リポジトリへ送信されず、ローカルにだけ保存されます。</p></div></article><article class="guide-step"><div><h3>島と好みのきのみを選ぶ</h3><p>「パーティ」で島を選ぶと固定きのみ3種が自動設定されます。ワカクサ本島では、その週に表示された3種を選んでください。</p></div></article><article class="guide-step"><div><h3>育成段階を切り替える</h3><p>現在、Lv50、Lv60、Lv70、Lv80を切り替えると、その時点で最も強い5匹とチーム合計がすぐ更新されます。</p></div></article><article class="guide-step"><div><h3>育成と整理を判断する</h3><p>「育成」は総合評価の高い候補、「送る」は全レベル・全ロールで同種上位に劣る候補です。未検証個体は安全のため送る候補になりません。</p></div></article></div><div class="guide-note"><div>🔒</div><div><strong>プライバシー優先</strong><span>スクリーンショット、動画、SQLite、ローカル設定はGitHubへ公開されません。</span></div></div>`}
const fmt=n=>Number(n||0).toLocaleString('ja-JP');let energyMode='current';
function energyPage(){const fs=INSIGHTS.forecasts||[];return `<section class="guide-intro"><div class="eyebrow">Cooking-free forecast</div><h2>島別エナジー予測</h2><p class="meta">料理を除き、きのみと直接エナジースキルだけを集計。ワカクサ本島は対象外です。</p></section><div class="mode-pills">${[['current','現在'],['50','Lv50'],['60','Lv60'],['70','Lv70'],['80','Lv80']].map(([v,n])=>`<button data-energy-mode="${v}" class="${v===energyMode?'active':''}">${n}</button>`).join('')}</div><div class="island-grid">${fs.map(f=>{const x=f.modes?.[energyMode],d=x?.daily||{};return `<article class="card"><span class="diagnosis">${esc(f.diagnosis)}</span><h2>${esc(f.island)}</h2><div class="meta">フィールドボーナス +${f.area_bonus}%</div>${x?`<div class="energy-number">1日 ${fmt(d.expected)}</div><div class="energy-range">安定 ${fmt(d.low)}〜上振れ ${fmt(d.high)} · 週 ${fmt(x.weekly.expected)}</div><div class="bar"><i style="width:${Math.min(100,d.expected/150000*100)}%"></i></div><p class="meta">きのみ ${fmt(d.berry)}　直接スキル ${fmt(d.skill)}</p><div class="tags">${x.members.map(m=>`<span class="tag">${esc(m.name)} ${fmt(m.energy)}</span>`).join('')}</div>`:'<div class="empty">非料理エナジーを取り込むと表示します</div>'}${energyMode==='60'?`<p><strong>現在から週 +${fmt(f.growth_to_60)}</strong></p>`:''}</article>`}).join('')}</div>`}
function capturePage(){const c=INSIGHTS.capture||{general:[],tailored:[]},section=(title,sub,rows)=>`<section class="card"><div class="eyebrow">Capture guide</div><h2>${title}</h2><p class="meta">${sub}</p>${rows.some(x=>x.sample)?'<div class="guide-note"><div>🧪</div><div><strong>公開デモ</strong><span>ここに表示される数値は架空のサンプルです。</span></div></div>':''}${rows.length?rows.map(x=>`<div class="capture-row"><div><strong>${esc(x.species)}</strong><div class="meta">${esc(x.island)} · ${esc(x.reason)}</div></div><strong>${fmt(x.daily)}/日</strong></div>`).join(''):'<div class="empty">Neroli’s Labで種族ベンチマークを生成すると表示します。</div>'}</section>`;return `<section class="guide-intro"><div class="eyebrow">What to catch next</div><h2>次に捕獲するポケモン</h2><p class="meta">理想個体の一般ランキングと、今の手持ちの島別不足を分けて表示します。</p></section>${section('今の手持ちで優先', '未所持または理想値の80%未満で、弱い島への改善量が大きい候補',c.tailored)}${section('一般的な最強候補', 'Lv60理想個体・料理なしの島別上位',c.general)}`}
function analysisPage(){const q=INSIGHTS.quality||{},growth=INSIGHTS.growth||[],coverage=INSIGHTS.coverage||[];return `<section class="guide-intro"><div class="eyebrow">Box intelligence</div><h2>育成・汎用性・目標分析</h2></section><article class="card"><h2>データ品質</h2><div class="quality"><div><strong>${q.total||0}</strong><span>総数</span></div><div><strong>${q.verified||0}</strong><span>検証済</span></div><div><strong>${q.unverified||0}</strong><span>未検証</span></div><div><strong>${q.low_confidence||0}</strong><span>低信頼</span></div></div></article><article class="card"><h2>目標到達・週途中の立て直し</h2><div class="goal-box"><label class="field"><span>目標エナジー</span><input id="goal-energy" type="number" value="1000000"></label><label class="field"><span>現在のエナジー</span><input id="current-energy" type="number" value="0"></label><label class="field"><span>残り日数</span><input id="days-left" type="number" min="1" max="7" value="7"></label><label class="field"><span>島</span><select id="goal-island">${(INSIGHTS.forecasts||[]).map((x,i)=>`<option value="${i}">${esc(x.island)}</option>`).join('')}</select></label></div><p id="goal-result" class="energy-number"></p></article><div class="insight-grid"><article class="card"><h2>Lv60育成効果</h2>${growth.slice(0,8).map(x=>`<div class="capture-row"><div><strong>${esc(x.name)}</strong><div class="meta">${esc(x.island)} · ${x.reasons.map(esc).join('／')}</div></div><strong>週 +${fmt(x.weekly_gain)}</strong></div>`).join('')||'<div class="empty">差分データがありません</div>'}</article><article class="card"><h2>全島汎用性</h2>${coverage.slice(0,8).map(x=>`<div class="capture-row"><div><strong>${esc(x.name)}</strong><div class="meta">${x.islands.map(esc).join('・')||'上位編成なし'}</div></div><strong>${x.count}島</strong></div>`).join('')}</article></div>`}
function updateGoal(){const i=+document.querySelector('#goal-island').value,target=+document.querySelector('#goal-energy').value,current=+document.querySelector('#current-energy').value,days=+document.querySelector('#days-left').value,f=(INSIGHTS.forecasts||[])[i],daily=f?.modes?.current?.daily?.expected||0,need=Math.max(0,target-current),eta=daily?Math.ceil(need/daily):0,projected=current+daily*days,short=Math.max(0,target-projected);document.querySelector('#goal-result').textContent=daily?(short?`到達まで約${eta}日 · 期限時点で ${fmt(short)}不足見込み`:`約${eta}日で到達 · 期限内に ${fmt(projected-target)}余裕`):'エナジーデータがありません'}
function draw(tab){document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});if(tab==='energy'){document.querySelector('#list').innerHTML=energyPage();document.querySelectorAll('[data-energy-mode]').forEach(b=>b.onclick=()=>{energyMode=b.dataset.energyMode;draw('energy')});return}if(tab==='capture'){document.querySelector('#list').innerHTML=capturePage();return}if(tab==='analysis'){document.querySelector('#list').innerHTML=analysisPage();document.querySelectorAll('#goal-energy,#goal-island').forEach(x=>x.oninput=updateGoal);updateGoal();return}if(tab==='teams'){document.querySelector('#list').innerHTML=teamControls();const bs=[...document.querySelectorAll('.berry')];bs.forEach((x,i)=>x.value=Object.keys(BERRIES)[i]);document.querySelector('#island').onchange=e=>{const preset=ISLANDS[e.target.value].berries;if(preset.length)bs.forEach((x,i)=>x.value=preset[i]);updateTeam()};bs.forEach(x=>x.onchange=()=>{document.querySelector('#island').value='custom';updateTeam()});document.querySelector('#team-mode').onchange=updateTeam;updateTeam();return}if(tab==='pokemon'){document.querySelector('#list').innerHTML=pokemonControls();document.querySelector('#poke-search').oninput=updatePokemonList;document.querySelector('#type-filter').onchange=updatePokemonList;updatePokemonList();return}if(tab==='guide'){document.querySelector('#list').innerHTML=guidePage();return}const xs=DATA.filter(x=>tab==='send'?['send','protected'].includes(x.verdict):(x.verdict||'protected')===tab).sort((a,b)=>(b.absolute_score||0)-(a.absolute_score||0));document.querySelector('#list').innerHTML=xs.length?xs.map(x=>{const e=x.evaluations||{};const best=l=>Math.max(...Object.values(e[l]||{0:0}));return `<article class="card ${x.verdict||tab}"><div class="meta">BOX ${x.box_index??'-'} · Lv${x.level??'-'}</div><h2>${esc(x.display_name||x.species_ja||x.species)} <small>${x.absolute_score??0} / 100</small></h2><p>${esc(x.reason)}</p><div class="scores">${['50','60','70','80'].map(l=>`<div class="score">Lv${l}<br><strong>${best(l)}</strong></div>`).join('')}</div><p class="meta">きのみ ${x.absolute_by_role?.berry??0}　食材 ${x.absolute_by_role?.ingredient??0}　スキル ${x.absolute_by_role?.skill??0}</p></article>`}).join(''):'<div class="card empty">該当する個体はありません。</div>'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>draw(b.dataset.tab));draw('energy');</script></body></html>
