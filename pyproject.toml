[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepbox-compass"
version = "0.1.0"
description = "Privacy-first box management and training compass for Pokemon Sleep"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
pokesleep-box = "pokesleep_box.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokesleep_box = ["schema.sql", "names_ja.json"]
